# /etc/nginx/conf.d/okuryazar-global.conf
# http {} baglaminda gecerli ayarlar: hiz siniri havuzlari ve sikistirma.

# Giris sayfasi icin siki sinir: dakikada 10 istek (IP basina).
limit_req_zone $binary_remote_addr zone=okuryazar_giris:10m rate=10r/m;

# Sitenin genel trafigi icin rahat sinir: saniyede 20 istek (IP basina).
limit_req_zone $binary_remote_addr zone=okuryazar_genel:10m rate=20r/s;

# Ayni anda tek IP'den acilabilecek baglanti sayisi.
limit_conn_zone $binary_remote_addr zone=okuryazar_conn:10m;

server_tokens off;

# Ubuntu'nun /etc/nginx/nginx.conf dosyasinda "gzip on;" zaten var; burada
# tekrar yazarsak nginx "duplicate directive" hatasi verir. Yalnizca ayarlari
# guncelliyoruz.
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/rss+xml
    application/xml application/manifest+json image/svg+xml;
