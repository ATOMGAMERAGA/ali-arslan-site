# fail2ban filtresi — sitede olmayan, bilindik saldiri yollarini deneyenler.
# Izlenen dosya: /var/log/nginx/okuryazar.access.log (nginx combined bicimi)
# Bu adresler sitede hic yok; isteyen yalnizca otomatik tarayicilardir.

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(GET|POST|HEAD) [^"]*(wp-login|wp-admin|xmlrpc\.php|/wp-content|/wp-includes|phpmyadmin|/pma/|/\.env|/\.git|/config\.php|/vendor/phpunit|/administrator/|/cgi-bin/|/shell|/boaform|\.php)[^"]*" (404|403|301|400) .*$

ignoreregex =
