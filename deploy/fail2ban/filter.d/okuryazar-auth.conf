# fail2ban filtresi — Ali Arslan blogunun kendi giris kayitlari
# Izlenen dosya: /var/log/okuryazar/auth.log
# Ornek satirlar:
#   2026-07-31T19:53:16.898Z okuryazar FAILED-LOGIN user="aliarslan" ip=1.2.3.4
#   2026-07-31T19:53:17.016Z okuryazar LOCKED ip=1.2.3.4 tries=5
#   2026-07-31T19:55:02.100Z okuryazar CSRF-REJECT POST /giris ip=1.2.3.4
#   2026-07-31T19:56:00.000Z okuryazar RATE-LIMIT /giris ip=1.2.3.4

[Definition]

failregex = ^\s*\S+ okuryazar FAILED-LOGIN user=\S+ ip=<HOST>\s*$
            ^\s*\S+ okuryazar LOCKED ip=<HOST> tries=\d+\s*$
            ^\s*\S+ okuryazar CSRF-REJECT \S+ \S+ ip=<HOST>\s*$
            ^\s*\S+ okuryazar RATE-LIMIT \S+ ip=<HOST>\s*$
            ^\s*\S+ okuryazar UPLOAD-FAIL ip=<HOST> .*$

ignoreregex =

[Init]
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S
